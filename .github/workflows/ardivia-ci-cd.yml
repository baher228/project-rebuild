name: Ardivia CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ardivia-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "Build failed on attempt ${attempt}; retrying in 10 seconds..."
            sleep 10
          done
          exit 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ARDIVIA_SSH_PRIVATE_KEY }}" > ~/.ssh/ardivia_deploy
          chmod 600 ~/.ssh/ardivia_deploy
          printf '%s\n' "${{ secrets.ARDIVIA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy latest main
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ardivia_deploy \
            -o IdentitiesOnly=yes \
            "${{ secrets.ARDIVIA_DEPLOY_USER }}@${{ secrets.ARDIVIA_DEPLOY_HOST }}" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /root/project-rebuild
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main
          npm ci
          for attempt in 1 2 3; do
            if NEXT_TELEMETRY_DISABLED=1 npm run build; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Build failed on attempt ${attempt}; retrying in 10 seconds..."
            sleep 10
          done
          systemctl restart ardivia.service
          systemctl is-active --quiet ardivia.service
          REMOTE

      - name: Smoke test production
        run: |
          set -euo pipefail
          for url in \
            "https://ardivia.co.uk/" \
            "https://www.ardivia.co.uk/" \
            "https://ardivia.co.uk/projects" \
            "https://ardivia.co.uk/services"
          do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$url" >/dev/null
          done
